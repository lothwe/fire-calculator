# Netlify runs the calculation tests before every deploy.
# If any test fails, the deploy is cancelled and the live site stays as it was.
[build]
  publish = "."
  command = "npm test"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
